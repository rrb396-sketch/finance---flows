name: Market flows (daily save + Saturday summary)

on:
  schedule:
    - cron: "47 15 * * 1-5"  # Mon-Fri 15:47 UTC = 21:17 India time: save that day's FII/DII (no Telegram)
    - cron: "17 3 * * 6"     # Saturday 03:17 UTC = 08:47 India time: full run + week totals + Telegram
    - cron: "47 15 * * 0"    # Sunday 15:47 UTC = 21:17 India time: option chains only (crypto trades on weekends)
  workflow_dispatch: {}      # "Run workflow" button = full Saturday-style run

permissions:
  contents: write

concurrency:
  group: weekly-flows   # never run two copies at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect data (daily or weekly)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "${{ github.event.schedule }}" = "47 15 * * 1-5" ]; then
            python collect.py daily
          elif [ "${{ github.event.schedule }}" = "47 15 * * 0" ]; then
            python collect.py options
          else
            python collect.py weekly
          fi
      - name: Save data to the repository
        run: |
          git config user.name "flows-bot"
          git config user.email "flows-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Market data $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push
